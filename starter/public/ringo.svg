<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 214 240" role="img" aria-labelledby="t">
  <title id="t">Ringo, a lizard in an 80s car dealer suit</title>
  <defs>
    <pattern id="plaid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#c8913a"/>
      <rect width="16" height="5" y="5" fill="#a8722a" opacity=".7"/>
      <rect width="5" height="16" x="5" fill="#a8722a" opacity=".7"/>
      <rect width="16" height="1.2" y="12" fill="#6b3f1a" opacity=".55"/>
      <rect width="1.2" height="16" x="12" fill="#6b3f1a" opacity=".55"/>
    </pattern>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a5c"/>
      <stop offset=".55" stop-color="#d9477b"/>
      <stop offset="1" stop-color="#f7a541"/>
    </linearGradient>
  </defs>

  <!-- tail -->
  <path d="M62 200 C20 205 8 175 26 160 C36 152 48 160 42 170" fill="none" stroke="#4f9a4a" stroke-width="13" stroke-linecap="round"/>

  <!-- legs -->
  <rect x="72" y="200" width="20" height="30" rx="6" fill="#4a3a2a"/>
  <rect x="108" y="200" width="20" height="30" rx="6" fill="#4a3a2a"/>
  <ellipse cx="80" cy="231" rx="16" ry="6" fill="#2a1f17"/>
  <ellipse cx="120" cy="231" rx="16" ry="6" fill="#2a1f17"/>

  <!-- jacket -->
  <path d="M56 120 Q100 104 144 120 L152 206 Q100 216 48 206 Z" fill="url(#plaid)" stroke="#6b3f1a" stroke-width="2"/>
  <!-- shirt -->
  <path d="M86 116 L100 170 L114 116 Z" fill="#fbf6ea"/>
  <!-- wide lapels -->
  <path d="M86 114 L70 122 L96 176 L100 168 Z" fill="#8c5a24"/>
  <path d="M114 114 L130 122 L104 176 L100 168 Z" fill="#8c5a24"/>
  <!-- wide tie -->
  <path d="M95 118 L105 118 L110 160 L100 172 L90 160 Z" fill="#d6452f"/>
  <path d="M93 132 L107 128 M92 144 L108 140 M91 156 L109 152" stroke="#f2b134" stroke-width="3"/>
  <!-- gold chain -->
  <path d="M84 118 Q100 134 116 118" fill="none" stroke="#f2c14e" stroke-width="2.5" stroke-dasharray="3 2"/>
  <!-- pocket square -->
  <path d="M124 146 L136 144 L134 152 L126 153 Z" fill="#fbf6ea"/>
  <path d="M126 146 L128 140 L131 145 L134 139 L134 146" fill="#d6452f"/>

  <!-- left arm holding key -->
  <path d="M58 128 Q38 160 54 182" fill="none" stroke="#b88232" stroke-width="18" stroke-linecap="round"/>
  <circle cx="56" cy="186" r="9" fill="#5fae57"/>
  <circle cx="56" cy="200" r="7" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <rect x="46" y="204" width="20" height="12" rx="2" fill="#fbf6ea" stroke="#6b3f1a"/>
  <text x="56" y="213" font-family="Arial Black, Arial, sans-serif" font-size="7" text-anchor="middle" fill="#d6452f">SOLD</text>

  <!-- right arm thumbs up -->
  <path d="M142 128 Q186 136 184 104" fill="none" stroke="#b88232" stroke-width="18" stroke-linecap="round"/>
  <rect x="172" y="84" width="24" height="22" rx="8" fill="#5fae57" stroke="#3f8a3a" stroke-width="1.5"/><path d="M174 90 Q170 74 176 66 Q182 62 184 70 L183 86 Z" fill="#5fae57" stroke="#3f8a3a" stroke-width="1.5" stroke-linejoin="round"/><path d="M183 90 L195 90 M183 96 L195 96 M183 102 L194 102" stroke="#3f8a3a" stroke-width="1.5" stroke-linecap="round"/>
  
  <rect x="170" y="104" width="28" height="6" rx="3" fill="#f2c14e"/>

  <!-- neck + head -->
  <rect x="88" y="96" width="24" height="22" rx="8" fill="#5fae57"/>
  <path d="M60 70 Q62 30 104 30 Q150 30 162 62 Q170 82 150 92 Q120 104 92 100 Q62 96 60 70 Z" fill="#5fae57" stroke="#3f8a3a" stroke-width="2"/>
  <!-- crest spikes (doubles as a mullet) -->
  <path d="M70 46 L66 30 L80 38 L80 24 L92 34 L96 20 L104 32 L112 22 L114 34" fill="#3f8a3a"/>
  <path d="M60 62 Q48 78 54 98 Q60 88 64 84 Q60 94 66 104 Q70 92 72 88" fill="#3f8a3a"/>
  <!-- belly / jaw tone -->
  <path d="M96 92 Q128 96 154 84" fill="none" stroke="#9fd49a" stroke-width="5" stroke-linecap="round"/>
  <!-- nostril -->
  <circle cx="156" cy="60" r="2.2" fill="#2f6e2b"/>
  <!-- aviators -->
  <path d="M84 54 L150 52" stroke="#c9a03a" stroke-width="3"/>
  <path d="M96 52 Q94 74 108 74 Q122 74 120 52 Z" fill="url(#lens)" stroke="#c9a03a" stroke-width="2.5"/>
  <path d="M126 52 Q125 70 136 70 Q148 70 147 52 Z" fill="url(#lens)" stroke="#c9a03a" stroke-width="2.5"/>
  <path d="M101 56 L106 56 M130 56 L134 56" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- moustache + grin -->
  <path d="M124 80 Q136 74 148 78 Q156 81 160 76 Q156 88 144 84 Q134 82 124 86 Z" fill="#4a2f1a"/>
  <path d="M118 90 Q138 98 156 86" fill="none" stroke="#2f6e2b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- gold tooth -->
  <rect x="138" y="90" width="5" height="5" rx="1" fill="#f2c14e"/>
</svg>
